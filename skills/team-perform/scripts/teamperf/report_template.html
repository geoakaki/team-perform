<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&display=swap">
<style>
:root{
  --bg:#f5f6f4;--surface:#fff;--ink:#1b2320;--muted:#5d6a64;--line:#dde2de;--accent:#1f6f54;--accent-soft:#e3f0ea;
  --h0:#eef1ef;--h1:#c6e6d3;--h2:#8fcca9;--h3:#4ea67a;--h4:#23734f;--h5:#114a32;--hink:#fff;
  --good:#2e8a58;--warn:#b07d10;--bad:#c2452d;--good-bg:#e3f3ea;--warn-bg:#fbf1dc;--bad-bg:#fbe7e2;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --cond:"IBM Plex Sans Condensed","IBM Plex Sans","Arial Narrow",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#121715;--surface:#1a211e;--ink:#e4ebe7;--muted:#9aa8a1;--line:#2c3632;--accent:#5fc496;--accent-soft:#1d3329;
  --h0:#1d2521;--h1:#1d3a2c;--h2:#205a3e;--h3:#2c8057;--h4:#4eb080;--h5:#8ee0b5;--hink:#0d1210;
  --good:#5cc48b;--warn:#e2b04a;--bad:#ec7b64;--good-bg:#1b3326;--warn-bg:#35291a;--bad-bg:#3a201b}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#121715;--surface:#1a211e;--ink:#e4ebe7;--muted:#9aa8a1;--line:#2c3632;--accent:#5fc496;--accent-soft:#1d3329;
  --h0:#1d2521;--h1:#1d3a2c;--h2:#205a3e;--h3:#2c8057;--h4:#4eb080;--h5:#8ee0b5;--hink:#0d1210;
  --good:#5cc48b;--warn:#e2b04a;--bad:#ec7b64;--good-bg:#1b3326;--warn-bg:#35291a;--bad-bg:#3a201b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);padding-inline:16px;padding-block:28px 64px}
.wrap{max-width:1200px;margin:0 auto;display:grid;gap:40px}
h1,h2,h3{font-family:var(--cond);text-wrap:balance;margin:0}
h1{font-size:clamp(28px,4.4vw,40px);line-height:1.1}h2{font-size:22px}h3{font-size:17px}
.eyebrow{font:500 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.lede{color:var(--muted);max-width:70ch;margin:8px 0 0}
.stats{display:flex;flex-wrap:wrap;gap:10px 28px;margin-top:12px;font:13px var(--mono);color:var(--muted)}
.stats b{font:600 20px var(--cond);color:var(--ink);margin-right:6px;font-variant-numeric:tabular-nums}
section{display:grid;gap:12px}
.note{font-size:13px;color:var(--muted)}
.scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
thead th{font:500 11px/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
th.sortable{cursor:pointer;user-select:none}th.sortable:hover,th.sortable:focus-visible{color:var(--ink);outline:none}
th.sorted::after{content:" ↓"}
.num{text-align:right}
.dev{display:grid;line-height:1.25}.dev b{font-weight:600}.dev span{font:12px var(--mono);color:var(--muted)}
.pill{display:inline-block;min-width:34px;padding:2px 7px;border-radius:4px;font:500 13px var(--mono);text-align:center}
.p-good{background:var(--good-bg);color:var(--good)}.p-warn{background:var(--warn-bg);color:var(--warn)}.p-bad{background:var(--bad-bg);color:var(--bad)}.p-na{color:var(--muted)}
.overall{display:flex;align-items:center;gap:10px;min-width:150px}.overall b{font:700 18px var(--cond);width:32px}
.bar{flex:1;height:8px;background:var(--h0);border-radius:2px;position:relative;overflow:hidden}.bar i{position:absolute;inset:0 auto 0 0}
.stale{color:var(--warn);font-weight:500}
.matrix{width:auto}.matrix td,.matrix th{padding:0;border:0}
.matrix tfoot td.repo{text-align:left}
.matrix th.col{writing-mode:vertical-rl;transform:rotate(180deg);height:150px;padding:10px 6px;vertical-align:bottom}
.matrix td.repo{padding:0 12px 0 10px;font:13px var(--mono);position:sticky;left:0;background:var(--surface)}
.matrix td.cell{width:46px;min-width:46px;height:28px;text-align:center;font:500 12px var(--mono);border:2px solid var(--surface)}
.matrix td.tot{padding:0 12px;font:500 12px var(--mono);color:var(--muted);text-align:right}
.matrix tr.grp td.repo{padding-top:14px;font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.matrix tfoot td{padding-top:8px;font:500 12px var(--mono);color:var(--muted);text-align:center}
.legend{display:flex;align-items:center;gap:6px;font:12px var(--mono);color:var(--muted)}.legend i{width:18px;height:12px;border-radius:2px}
.summary{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:6px;padding:18px 20px;display:grid;gap:10px}
.summary p{margin:0;font-size:16px;max-width:75ch}.summary ul{margin:0;padding-left:18px;display:grid;gap:4px}
.flags{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.flags li{display:grid;grid-template-columns:80px 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:4px;padding:10px 14px;font-size:14px}
.flags li.medium{border-left-color:var(--warn)}.flags li.low{border-left-color:var(--line)}
.sev{font:600 11px/1.8 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--bad)}.medium .sev{color:var(--warn)}.low .sev{color:var(--muted)}
code{font:12.5px var(--mono)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px 18px;display:grid;gap:10px;align-content:start}
.card-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.score{font:700 30px/1 var(--cond)}.score small{font:500 13px var(--mono);color:var(--muted)}
.meta{font:12px var(--mono);color:var(--muted)}
.dims{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.dims div{display:grid;gap:3px;text-align:center;font:10px var(--mono);color:var(--muted);text-transform:uppercase}
.card ul{margin:0;padding-left:18px;font-size:13.5px;display:grid;gap:3px}
.lbl{font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lbl.g{color:var(--good)}.lbl.b{color:var(--bad)}
.verdict{margin:0;font-size:14px}
.method{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px 20px;display:grid;gap:8px;font-size:14px}
.method ul{margin:0;padding-left:18px;color:var(--muted);display:grid;gap:4px}
.weights{display:flex;flex-wrap:wrap;gap:8px}.weights span{font:12px var(--mono);background:var(--accent-soft);color:var(--accent);padding:3px 8px;border-radius:3px}


.area{color:var(--muted);font-size:13px;white-space:normal;min-width:150px}
.sha{font:12.5px var(--mono)}
.sec-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px}
.flags p{margin:2px 0 0;color:var(--muted);font-size:14px}
.hire{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:6px;padding:20px 22px;display:grid;gap:16px}
.hire .bottom{margin:0;font-size:16px;max-width:75ch}
.hire h3{font-size:15px}
.hire ul{margin:0;padding-left:18px;display:grid;gap:4px}
.picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.pick{border:1px solid var(--line);border-radius:5px;padding:12px 14px;display:grid;gap:6px;align-content:start}
.pick.first{border-color:var(--accent);background:var(--accent-soft)}
.pick-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pick-top b{font:600 17px var(--cond)}
.tag{font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);text-align:right}
.pick ul{font-size:13.5px;gap:3px}
.pick .caveat{font-size:13px;color:var(--warn);margin:0}
.hire table td,.hire table th{white-space:normal}.hire table td:first-child{white-space:nowrap}
.twocol{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.twocol ul{margin-top:6px;font-size:14px}
.ask{margin:0;font-size:14px;color:var(--muted)}
@media (max-width:520px){.cards{grid-template-columns:1fr}.flags li{grid-template-columns:1fr;gap:4px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="eyebrow" id="eyebrow"></div>
  <h1 id="title"></h1>
  <p class="lede" id="lede"></p>
  <div class="stats" id="stats"></div>
</header>
<section class="hire" id="summary" hidden></section>
<section><div class="sec-head"><h2>Scores</h2><span class="note" id="scorenote"></span></div><div class="scroll"><table id="scores"></table></div></section>
<section><div class="sec-head"><h2>Commits by repository</h2><div class="legend" id="legend"></div></div>
  <div class="note" id="matrixnote"></div>
  <div class="scroll"><table class="matrix" id="matrix"></table></div><div class="note" id="quiet"></div></section>
<section id="flagsec"><h2 id="flagtitle">Rule findings</h2><div class="note" id="flagnote"></div><ul class="flags" id="flags"></ul></section>
<section><h2 id="cardtitle">People</h2><div class="cards" id="cards"></div></section>
<section class="method"><h3>How the scores are made</h3><div class="weights" id="weights"></div><ul id="method"></ul></section>
</div>
<script>
const D = __DATA__;
const R = D.report || {}, S = D.summary, M = D.meta, P = D.people;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// **bold**, `code` and commit shas in free text written by the reviewer
const rich = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>")
  .replace(/(^|[\s(,;\/>])((?=[0-9a-f]*\d)[0-9a-f]{7,12})(?=[\s),;.:\/<]|$)/g, '$1<span class="sha">$2</span>');
const cls = v => v == null ? "p-na" : v >= 7 ? "p-good" : v >= 5 ? "p-warn" : "p-bad";
const col = v => v == null ? "var(--muted)" : v >= 7 ? "var(--good)" : v >= 5 ? "var(--warn)" : "var(--bad)";
const fmt = v => v == null ? "–" : (+v).toFixed(1).replace(/\.0$/, "");
const day = s => { if (!s) return ""; const d = new Date(s.slice(0,10) + "T00:00:00Z");
  return d.toLocaleDateString("en-GB", {day:"2-digit", month:"short", timeZone:"UTC"}); };
const HD = [["messages","Messages"],["size","Size"],["tests","Tests"],["hygiene","Hygiene"],["security","Security"]];
const RD = [["quality","Quality"],["hygiene","Size & focus"],["messages","Messages"],["security","Security"],["tests","Tests"]];
const RW = {quality:35, hygiene:20, messages:15, security:15, tests:15};
const hasRev = P.some(p => p.review);
const hasArea = P.some(p => p.review?.area);
const main = p => hasRev && p.review ? p.review.overall : p.heur.overall;
const handle = p => p.logins.length ? p.logins.map(l => "@" + l).join(", ") : "";
const span = `${day(M.since)} – ${day(M.until)} ${M.until.slice(0,4)}`;

const title = R.title || `${M.scope} Team Scorecard`;
document.title = title;
document.getElementById("eyebrow").textContent = R.eyebrow || `${M.provider} · ${M.scope}`;
document.getElementById("title").textContent = title;
document.getElementById("lede").innerHTML = R.lede ? rich(R.lede) :
  esc(`Who committed where from ${span}, and a 0–10 score per person` +
      (hasRev ? ` from a review of their last ${M.per_person} commits that weren't merges.` : " from commit rules.") +
      ` Generated ${M.generated}.`);
const grand = P.reduce((a,p)=>a+p.commits,0);
const repoCount = new Set(P.flatMap(p=>Object.keys(p.per_repo))).size;
document.getElementById("stats").innerHTML = [[P.length,"people"],[repoCount, `repos with commits (of ${M.repos_total})`],
  [grand.toLocaleString(),"commits"],[(P.reduce((a,p)=>a+(main(p)||0),0)/Math.max(1,P.length)).toFixed(1),"average score"]]
  .map(([b,t])=>`<span><b>${b}</b>${esc(t)}</span>`).join("");

// recommendation box (reviews/_summary.json)
if (S) {
  const s = document.getElementById("summary"); s.hidden = false;
  const list = a => a?.length ? `<ul>${a.map(x=>`<li>${rich(x)}</li>`).join("")}</ul>` : "";
  s.innerHTML = `<div class="eyebrow">${esc(S.eyebrow || "Summary")}</div><h2>${esc(S.title || "Recommendation")}</h2>` +
    (S.headline ? `<p class="bottom">${rich(S.headline)}</p>` : "") + list(S.points) +
    (S.picks?.length ? `<div class="picks">${S.picks.map((k,i)=>`<div class="pick ${i===0?"first":""}">
      <div class="pick-top"><b>${i+1}. ${esc(k.name)}</b><span class="tag">${esc(k.tag)}</span></div>${list(k.points)}
      ${k.caveat ? `<p class="caveat">${rich(k.caveat)}</p>` : ""}</div>`).join("")}</div>` : "") +
    (S.table?.rows?.length ? `<div><h3>${esc(S.table.title || "")}</h3><div class="scroll" style="margin-top:8px"><table>
      <thead><tr>${(S.table.columns||[]).map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead>
      <tbody>${S.table.rows.map(r=>`<tr>${r.map(c=>`<td>${rich(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>` : "") +
    (S.columns?.length ? `<div class="twocol">${S.columns.map(c=>`<div><h3>${esc(c.title)}</h3>${list(c.points)}</div>`).join("")}</div>` : "") +
    (S.ask ? `<p class="ask">${rich(S.ask)}</p>` : "");
}

// scores
const ranked = [...P].sort((a,b)=>(main(b)??-1)-(main(a)??-1)); ranked.forEach((p,i)=>p.rank=i+1);
document.getElementById("scorenote").textContent = "Click a column header to sort";
const cols = [{k:"rank",t:"#",v:p=>-p.rank},{k:"name",t:hasRev?"Developer":"Person",v:p=>p.name.toLowerCase()}];
if (hasArea) cols.push({k:"area",t:"Works on",area:1,v:p=>(p.review?.area||"").toLowerCase()});
if (hasRev) cols.push(...RD.map(([k,t])=>({k:"r_"+k,t,num:1,pill:1,v:p=>p.review?.scores?.[k]})),
                      {k:"rev",t:"Overall",bar:1,v:p=>p.review?.overall}, {k:"hov",t:"Rules",num:1,pill:1,v:p=>p.heur.overall});
else cols.push(...HD.map(([k,t])=>({k:"h_"+k,t,num:1,pill:1,v:p=>p.heur.scores[k]})), {k:"hov",t:"Overall",bar:1,v:p=>p.heur.overall});
cols.push({k:"commits",t:"Commits",num:1,v:p=>p.commits},{k:"repos",t:"Repos",num:1,v:p=>p.repos},{k:"last",t:"Last commit",v:p=>p.last});
let sortK = hasRev ? "rev" : "hov";
function drawScores(){
  const c = cols.find(c=>c.k===sortK);
  const rows = [...P].sort((a,b)=>{const x=c.v(a),y=c.v(b); return (y??-1e9)>(x??-1e9)?1:(y??-1e9)<(x??-1e9)?-1:a.rank-b.rank;});
  const staleDay = new Date(Date.parse(M.until) - 21*864e5).toISOString().slice(0,10);
  const cell = (c,p) => { const v = c.v(p);
    if (c.k==="rank") return `<td style="font:600 15px var(--cond);color:var(--muted)">${p.rank}</td>`;
    if (c.k==="name") return `<td><div class="dev"><b>${esc(p.name)}</b><span>${esc(handle(p))}</span></div></td>`;
    if (c.area) return `<td class="area">${esc(p.review?.area || "")}</td>`;
    if (c.k==="last") return `<td class="${v<staleDay?"stale":""}">${esc(v)}</td>`;
    if (c.bar) return `<td><div class="overall"><b style="color:${col(v)}">${fmt(v)}</b><div class="bar"><i style="width:${(v||0)*10}%;background:${col(v)}"></i></div></div></td>`;
    if (c.pill) return `<td class="num"><span class="pill ${cls(v)}">${fmt(v)}</span></td>`;
    return `<td class="num">${v ?? "–"}</td>`; };
  const t = document.getElementById("scores");
  t.innerHTML = `<thead><tr>${cols.map(c=>`<th class="sortable ${c.num?"num":""} ${c.k===sortK?"sorted":""}" tabindex="0" data-k="${c.k}">${c.t}</th>`).join("")}</tr></thead><tbody>` +
    rows.map(p=>`<tr>${cols.map(c=>cell(c,p)).join("")}</tr>`).join("") + "</tbody>";
  t.querySelectorAll("th").forEach(th=>{const go=()=>{sortK=th.dataset.k;drawScores();}; th.onclick=go; th.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go();}};});
}
drawScores();

// matrix; groups from reviews/_report.json repo_groups {"Label": "regex"} or from repo-name prefixes
const repos = {}; P.forEach(p=>Object.entries(p.per_repo).forEach(([r,n])=>{(repos[r] ||= {})[p.id]=n;}));
const groups = {}; let order;
if (R.repo_groups) {
  const rx = Object.entries(R.repo_groups).map(([g,re])=>[g,new RegExp(re,"i")]);
  Object.keys(repos).sort().forEach(r=>{const m = rx.find(([,re])=>re.test(r)); (groups[m?m[0]:"other"] ||= []).push(r);});
  order = [...rx.map(([g])=>g), "other"].filter(g=>groups[g]);
} else {
  const grp = r => r.includes("/") ? r.split("/")[0] : r.split(/[-_]/)[0];
  Object.keys(repos).sort().forEach(r=>(groups[grp(r)] ||= []).push(r));
  const other = []; for (const [g,l] of Object.entries(groups)) if (l.length < 2) { other.push(...l); delete groups[g]; }
  if (other.length) groups["other"] = other;
  order = Object.keys(groups).sort((a,b)=>a==="other"?1:b==="other"?-1:a.localeCompare(b));
}
const H = ["var(--h1)","var(--h2)","var(--h3)","var(--h4)","var(--h5)"], steps=[10,30,75,150];
const shade = n => { if(!n) return ["var(--h0)",""]; const i = steps.findIndex(s=>n<s); const k = i<0?4:i; return [H[k], k>=3?"var(--hink)":"var(--ink)"]; };
document.getElementById("legend").innerHTML = "fewer "+H.map(c=>`<i style="background:${c}"></i>`).join("")+" more";
document.getElementById("matrixnote").textContent = `Commits per person since ${day(M.since)} ${M.since.slice(0,4)} across all branches, each commit counted once (merges included). People are in score order.`;
const single = order.length === 1 && order[0] === "other";
let mh = `<thead><tr><th></th>${ranked.map(p=>`<th class="col">${esc(p.name)}</th>`).join("")}<th class="col">Total</th></tr></thead><tbody>`;
for (const g of order) {
  if (!single) mh += `<tr class="grp"><td class="repo" colspan="${ranked.length+2}">${esc(g)}</td></tr>`;
  for (const r of groups[g]) { let t=0;
    mh += `<tr><td class="repo">${esc(r)}</td>` + ranked.map(p=>{const n=repos[r][p.id]||0;t+=n;const [bg,fg]=shade(n);return `<td class="cell" style="background:${bg};color:${fg}" title="${esc(p.name)} · ${esc(r)}: ${n}">${n||""}</td>`;}).join("") + `<td class="tot">${t}</td></tr>`; }
}
mh += `</tbody><tfoot><tr><td class="repo">Total</td>${ranked.map(p=>`<td>${p.commits}</td>`).join("")}<td>${grand}</td></tr></tfoot>`;
document.getElementById("matrix").innerHTML = mh;
document.getElementById("quiet").textContent = D.quiet_repos.length ? "No commits in this period: " + D.quiet_repos.join(", ") + "." : "";

// security: curated issues from reviews/_report.json, else the raw rule findings
const sevRank = {high:0,medium:1,low:2};
if (R.security?.length) {
  document.getElementById("flagtitle").textContent = "Security issues to fix";
  document.getElementById("flagnote").hidden = true;
  document.getElementById("flags").innerHTML = [...R.security].sort((a,b)=>sevRank[a.severity]-sevRank[b.severity])
    .map(f=>`<li class="${esc(f.severity)}"><div class="sev">${esc(f.severity)}</div><div><b>${rich(f.title)}</b>${f.detail?`<p>${rich(f.detail)}</p>`:""}</div></li>`).join("");
} else {
  const fl = P.flatMap(p=>p.heur.findings.map(f=>({...f,who:p.name}))).sort((a,b)=>sevRank[a.severity]-sevRank[b.severity]);
  if (!fl.length) document.getElementById("flagsec").hidden = true;
  document.getElementById("flagnote").textContent = "Pattern matches in added lines of sampled commits. The matched values are never shown; open the commit to check each one.";
  document.getElementById("flags").innerHTML = fl.map(f=>`<li class="${f.severity}"><div class="sev">${f.severity}</div><div><b>${esc(f.rule)}</b> in <code>${esc(f.repo)}/${esc(f.file)}</code> · <code>${esc(f.sha)}</code> · ${esc(f.who)}</div></li>`).join("");
}

// cards
document.getElementById("cardtitle").textContent = hasRev ? "Developer reviews" : "People";
document.getElementById("cards").innerHTML = ranked.map(p=>{
  const r = p.review, h = p.heur, m = h.metrics, sc = p.sample_commits;
  const dims = r && r.scores ? RD.map(([k,t])=>[r.scores[k],t]) : HD.map(([k,t])=>[h.scores[k],t]);
  const dates = sc.map(c=>c.date).filter(Boolean).sort();
  const range = dates.length ? `${day(dates[0])} – ${day(dates[dates.length-1])}` : "";
  const sub = [handle(p), r?.area].filter(Boolean).join(" · ");
  return `<article class="card">
  <div class="card-top"><div class="dev"><h3>${p.rank}. ${esc(p.name)}</h3><span>${esc(sub)}</span></div>
  <div class="score" style="color:${col(main(p))}">${fmt(main(p))}<small>/10</small></div></div>
  <div class="meta">${sc.length ? `${sc.length} commits reviewed · ${esc(range)} · ` : ""}${p.commits} commits in period · ${p.repos} repos · last ${esc(p.last)}</div>
  <div class="dims">${dims.map(([v,t])=>`<div><span class="pill ${cls(v)}">${fmt(v)}</span>${t}</div>`).join("")}</div>
  <div class="meta">${r?"Rule score "+fmt(h.overall)+" · ":""}vague messages ${m.vague_message_pct}% · reverts ${m.reverts} · median ${m.median_lines ?? "–"} lines/commit · tests with code ${m.test_ratio_pct ?? "–"}%</div>
  ${r?.verdict ? `<p class="verdict">${rich(r.verdict)}</p>` : ""}
  ${r?.strengths?.length ? `<div class="lbl g">Strengths</div><ul>${r.strengths.map(x=>`<li>${rich(x)}</li>`).join("")}</ul>` : ""}
  ${r?.issues?.length ? `<div class="lbl b">Issues</div><ul>${r.issues.map(x=>`<li>${rich(x)}</li>`).join("")}</ul>` : ""}
  ${!r && sc.length ? `<div class="lbl">Latest sampled commits</div><ul>${sc.slice(0,5).map(c=>`<li><code>${esc(c.sha)}</code> ${esc(c.subject)} <span class="meta">(${c.lines} lines)</span></li>`).join("")}</ul>` : ""}
  </article>`; }).join("");

// method
const W = hasRev ? Object.entries(RW).map(([k,v])=>[RD.find(d=>d[0]===k)[1],v]) : Object.entries(M.weights).map(([k,v])=>[k,Math.round(v*100)]);
document.getElementById("weights").innerHTML = W.map(([k,v])=>`<span>${esc(k)} ${v}%</span>`).join("");
document.getElementById("method").innerHTML = [
  hasRev ? `Review scores come from a reviewer reading each person's last ${M.per_person} commits that weren't merges, with their diffs, and judging quality, focus, messages, security and tests.`
         : `Rule scores come from scripts: messages over every commit in the period that isn't a merge; size, tests, hygiene and security from each person's last ${M.per_person} such commits.`,
  hasRev ? "Rule scores (the Rules column) are computed by scripts from the same commits and are shown for comparison." : "Rules see commit discipline, not design or correctness. A written review adds those.",
  "Identities are merged by login, email and author name, plus any aliases set for this run.",
  "A short sample is not a performance review. Squash-merge workflows and single large features can make someone look worse than they are.",
  ...(R.method_notes || [])].map(x=>`<li>${rich(x)}</li>`).join("");
</script>
</body>
</html>
